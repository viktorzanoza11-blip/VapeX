<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VapeX — визитка</title>
<meta name="description" content="VapeX — команда профессионалов. Электронные сигареты. Связь в Telegram: @Vapex_lg. 18+">
<style>
:root{
  --bg:#dfe5ee; --ink:#14203b; --muted:#56627c; --card:#ffffff; --card-back:#14203b;
  --card-back-ink:#f2f5fb; --accent:#2b3fe0; --line:#c9d1e0; --shadow:rgba(20,32,59,.22);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --ink:#eef2fb; --muted:#9aa6c0; --card:#1a2340; --card-back:#e9eefc;
    --card-back-ink:#14203b; --accent:#8fa0ff; --line:#2a3560; --shadow:rgba(0,0,0,.5);
  }
}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  display:grid; place-items:center; padding:24px; line-height:1.5;
  background-image:radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 45%);
}
main{width:100%;max-width:520px;text-align:center}

.scene{perspective:1400px}
.card{
  position:relative; width:100%; aspect-ratio:7/4; border:0; padding:0; background:none;
  cursor:pointer; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.3,.7,.2,1);
  font:inherit; color:inherit; text-align:left; display:block;
}
.card.flipped{transform:rotateY(180deg)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:14px}
.face{
  position:absolute; inset:0; border-radius:14px; padding:clamp(18px,5vw,34px);
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 24px 40px -18px var(--shadow), 0 4px 10px -4px var(--shadow);
  display:flex; flex-direction:column; justify-content:space-between;
}
.front{background:var(--card)}
.front::after{ /* корешок-полоса */
  content:""; position:absolute; left:0; top:0; bottom:0; width:10px;
  background:var(--accent); border-radius:14px 0 0 14px;
}
.back{background:var(--card-back);color:var(--card-back-ink);transform:rotateY(180deg)}

.name{font-family:var(--serif);font-size:clamp(1.9rem,8vw,3rem);line-height:1.02;margin:0;letter-spacing:-.01em;font-weight:700}
.tag{margin:.6em 0 0;color:var(--muted);font-size:clamp(.9rem,3.2vw,1.05rem);max-width:30ch}
.owner{font-size:.9rem;display:flex;justify-content:space-between;align-items:end;gap:12px}
.owner b{font-weight:650}
.owner span{color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);white-space:nowrap}

.back{overflow:hidden;gap:6px}
.back>*{position:relative;z-index:1}
.smoke{position:absolute!important;right:-6px;top:-8px;height:120%;width:auto;z-index:0!important;
  fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;opacity:.13}
.back-top h2{font-family:var(--serif);font-size:clamp(1.6rem,7vw,2.3rem);line-height:1.05;margin:0;font-weight:700;letter-spacing:-.01em}
.lead{margin:.45em 0 0;font-size:clamp(.95rem,3.6vw,1.15rem);opacity:.78;max-width:26ch}
.back ul{list-style:none;margin:0;padding:0}
.back li a{
  display:inline-flex;align-items:center;gap:.5em;text-decoration:none;
  font-size:clamp(1.35rem,6.4vw,2.1rem);font-weight:700;letter-spacing:-.01em;
  background:var(--accent);color:#fff;padding:.28em .7em .3em .5em;border-radius:12px;
}
.back li a svg{width:1em;height:1em;flex:none}
.back li a:hover{filter:brightness(1.1)}
.back li a:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.back-bottom{display:flex;justify-content:space-between;align-items:center}
.back .hint{color:inherit;opacity:.6}
.badge{font-size:.8rem;font-weight:700;border:1.5px solid currentColor;border-radius:999px;padding:.05em .6em;opacity:.8}
@media (max-width:480px){ .card{aspect-ratio:auto;min-height:250px} }

.about{margin:34px auto 0;max-width:46ch;color:var(--muted);font-size:1rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.btn{
  font:inherit;font-size:.95rem;font-weight:600;cursor:pointer;
  padding:.7em 1.2em;border-radius:10px;border:1.5px solid var(--ink);
  background:var(--ink);color:var(--bg);text-decoration:none;transition:transform .15s;
}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.age{margin:28px 0 0;font-size:.78rem;color:var(--muted);opacity:.85}
.toast{min-height:1.5em;margin-top:12px;font-size:.88rem;color:var(--muted)}

@media (max-width:420px){ .hint{display:none} }
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<main>
  <div class="scene">
    <button class="card" id="card" type="button" aria-pressed="false" aria-label="Визитка. Нажмите, чтобы перевернуть">
      <span class="face front">
        <span>
          <h1 class="name" data-f="name">VapeX</h1>
          <p class="tag" data-f="tagline">Команда профессионалов: поможем выбрать устройство и жидкость под ваш вкус.</p>
        </span>
        <span class="owner">
          <span><b data-f="person">Команда VapeX</b><br><span data-f="role">Электронные сигареты</span></span>
          <span class="hint">нажмите — контакты</span>
        </span>
      </span>
      <span class="face back">
        <svg class="smoke" viewBox="0 0 200 200" aria-hidden="true">
          <path d="M20 190c40-30-30-50 10-80s-20-50 20-80" />
          <path d="M70 195c40-30-30-50 10-80s-20-50 20-80" />
          <path d="M120 200c40-30-30-50 10-80s-20-50 20-80" />
        </svg>
        <span class="back-top">
          <h2>Мы на связи</h2>
          <p class="lead">Напишите — подберём и ответим по наличию.</p>
        </span>
        <ul id="contacts"></ul>
        <span class="back-bottom">
          <span class="badge">18+</span>
          <span class="hint">нажмите — вернуться</span>
        </span>
      </span>
    </button>
  </div>

  <p class="about" data-f="about">Продаём электронные сигареты, одноразовые устройства и жидкости. Подскажем, что подойдёт именно вам, и ответим на вопросы по ассортименту и наличию. Пишите в Telegram.</p>

  <div class="actions">
    <a class="btn" id="mailBtn" href="https://t.me/Vapex_lg" target="_blank" rel="noopener">Написать в Telegram</a>
    <button class="btn ghost" id="copyBtn" type="button">Скопировать ник</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="age">Только для лиц старше 18 лет. Содержит никотин, вызывает зависимость.</p>
</main>

<script>
/* ====== РЕДАКТИРУЙТЕ ЗДЕСЬ ====== */
const DATA = {
  name:    "VapeX",
  tagline: "Команда профессионалов: поможем выбрать устройство и жидкость под ваш вкус.",
  person:  "Команда VapeX",
  role:    "Электронные сигареты",
  about:   "Продаём электронные сигареты, одноразовые устройства и жидкости. Подскажем, что подойдёт именно вам, и ответим на вопросы по ассортименту и наличию. Пишите в Telegram.",
  contacts: [
    { label: "Telegram", text: "@Vapex_lg", href: "https://t.me/Vapex_lg" }
  ]
};
/* ================================= */

document.querySelectorAll("[data-f]").forEach(el => { el.textContent = DATA[el.dataset.f]; });
document.title = DATA.name + " — визитка";

const list = document.getElementById("contacts");
const ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 3.3 2.8 10.6c-.8.3-.8 1.4 0 1.7l4.7 1.5 1.8 5.6c.2.6 1 .8 1.4.3l2.6-2.6 4.7 3.5c.6.4 1.4.1 1.6-.6L22.9 4.5c.2-.9-.6-1.5-1.4-1.2zM9.4 13.4l8.4-5.2-6.6 6.3-.3 3.3-1.5-4.4z"/></svg>';
DATA.contacts.forEach(c => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = c.href;
  a.setAttribute("aria-label", c.label + ": " + c.text);
  a.innerHTML = ICON + "<span></span>";
  a.lastChild.textContent = c.text;
  if (/^https?:/.test(c.href)) { a.target = "_blank"; a.rel = "noopener"; }
  a.addEventListener("click", e => e.stopPropagation());
  li.appendChild(a); list.appendChild(li);
});

const card = document.getElementById("card");
card.addEventListener("click", () => {
  const on = card.classList.toggle("flipped");
  card.setAttribute("aria-pressed", on);
});

const tg = DATA.contacts.find(c => c.href.includes("t.me"));
if (tg) document.getElementById("mailBtn").href = tg.href;

const toast = document.getElementById("toast");
document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = DATA.contacts[0].text;
  try {
    await navigator.clipboard.writeText(text);
    toast.textContent = "Ник скопирован";
  } catch (e) {
    toast.textContent = "Не удалось скопировать — выделите текст вручную";
  }
  setTimeout(() => toast.textContent = "", 2500);
});
</script>
</body>
</html>
