<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VapeX — визитка</title>
<meta name="description" content="VapeX — команда профессионалов. Электронные сигареты. Связь в Telegram: @Vapex_lg. 18+">
<style>
:root{
  --navy-1:#1a2a9c; --navy-2:#0b1352; --navy-3:#050829;
  --gold-1:#eef3ff; --gold-2:#9fb0dc; --gold-3:#5d6fa8;
  --ivory:#eaf0ff; --ink:#0b1146;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  color:var(--ivory); font-family:var(--sans); line-height:1.55;
  display:grid; place-items:center; padding:24px; overflow-x:hidden;
  background:
    radial-gradient(ellipse 80% 55% at 50% -5%, var(--navy-1) 0%, transparent 70%),
    linear-gradient(180deg, var(--navy-2) 0%, var(--navy-3) 100%);
  background-attachment:fixed;
}
/* зерно и виньетка */
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
body::before{
  opacity:.07; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
body::after{background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%)}
main{position:relative;z-index:1;width:100%;max-width:540px;text-align:center}

.scene{perspective:1400px}
.tilt{transform-style:preserve-3d;transition:transform .25s ease-out;animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}

.card{
  position:relative; width:100%; aspect-ratio:7/4; border:0; padding:0; background:none;
  cursor:pointer; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.3,.7,.2,1);
  font:inherit; color:inherit; text-align:left; display:block;
}
.card.flipped{transform:rotateY(180deg)}
.card:focus-visible{outline:2px solid var(--gold-1);outline-offset:8px;border-radius:16px}

.face{
  position:absolute; inset:0; border-radius:14px; padding:clamp(26px,6.5vw,44px);
  backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 0 0 1px rgba(170,190,240,.28), 0 45px 70px -30px rgba(0,0,0,.85), 0 12px 24px -12px rgba(0,0,0,.6);
}
.face::before{ /* серебристая рамка-паспарту */
  content:""; position:absolute; inset:10px; border-radius:8px; pointer-events:none;
  border:1px solid rgba(170,190,240,.55);
}
.face::after{ /* блик, следует за курсором */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,28%) var(--my,15%), rgba(255,255,255,.16), transparent 55%);
}
.front{background:linear-gradient(145deg,#16238a 0%,#0b1352 55%,#060a33 100%);color:var(--ivory)}
.back{
  background:linear-gradient(145deg,#f7f9ff 0%,#dbe3f6 55%,#b9c6e6 100%);
  color:var(--ink); transform:rotateY(180deg);
}
.back::before{border-color:rgba(11,17,70,.35)}
.back::after{background:radial-gradient(420px circle at var(--mx,70%) var(--my,15%), rgba(255,255,255,.4), transparent 55%)}

.name{
  font-family:var(--serif); font-weight:700; margin:0; line-height:1;
  font-size:clamp(2.4rem,11vw,3.9rem); letter-spacing:.02em;
  background:linear-gradient(100deg,var(--gold-1) 0%,var(--gold-2) 40%,var(--gold-1) 65%,var(--gold-2) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.rule{display:block;width:56px;height:1px;margin:1em 0 .9em;background:linear-gradient(90deg,var(--gold-2),transparent)}
.tag{margin:0;color:rgba(234,240,255,.82);font-size:clamp(.92rem,3.3vw,1.1rem);max-width:30ch;letter-spacing:.01em}
.owner{font-size:.9rem;display:flex;justify-content:space-between;align-items:end;gap:12px}
.owner b{font-weight:600;letter-spacing:.04em}
.role{color:var(--gold-2);letter-spacing:.06em;font-size:.84rem}
.hint{font-size:.76rem;color:rgba(234,240,255,.5);white-space:nowrap}

.back{gap:6px}
.back>*{position:relative;z-index:1}
.smoke{position:absolute!important;right:-6px;top:-8px;height:120%;width:auto;z-index:0!important;
  fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;opacity:.11}
.back-top h2{font-family:var(--serif);font-size:clamp(1.7rem,7.2vw,2.4rem);line-height:1.05;margin:0;font-weight:700;letter-spacing:.01em}
.lead{margin:.5em 0 0;font-size:clamp(.95rem,3.6vw,1.15rem);opacity:.78;max-width:26ch}
.back ul{list-style:none;margin:0;padding:0}
.back li a{
  display:inline-flex;align-items:center;gap:.55em;text-decoration:none;
  font-size:clamp(1.25rem,6vw,1.95rem);font-weight:650;letter-spacing:.01em;
  background:linear-gradient(145deg,#142070,#070c3a);color:var(--gold-1);
  padding:.3em .8em .32em .6em;border-radius:12px;
  box-shadow:0 10px 22px -10px rgba(5,8,41,.7), inset 0 0 0 1px rgba(170,190,240,.45);
}
.back li a svg{width:1em;height:1em;flex:none;color:var(--gold-2)}
.back li a:hover{filter:brightness(1.18)}
.back li a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.back-bottom{display:flex;justify-content:space-between;align-items:center}
.back .hint{color:var(--ink);opacity:.55}
.badge{font-size:.78rem;font-weight:700;border:1px solid var(--ink);border-radius:999px;padding:.05em .65em;opacity:.75;letter-spacing:.04em}
@media (max-width:480px){ .card{aspect-ratio:auto;min-height:260px} }

.about{white-space:pre-line;margin:40px auto 0;max-width:46ch;color:rgba(234,240,255,.76);font-size:1rem}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
.btn{
  font:inherit;font-size:.95rem;font-weight:600;letter-spacing:.03em;cursor:pointer;
  padding:.8em 1.5em;border-radius:999px;text-decoration:none;
  border:1px solid var(--gold-2);transition:transform .2s,filter .2s;
}
.btn:not(.ghost){background:linear-gradient(135deg,#ffffff,#b9c8f0);color:var(--ink);border-color:transparent;box-shadow:0 12px 26px -12px rgba(130,160,255,.6)}
.btn.ghost{background:transparent;color:var(--gold-1)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--gold-1);outline-offset:3px}
.toast{min-height:1.5em;margin-top:12px;font-size:.88rem;color:var(--gold-1)}
.age{margin:26px 0 0;font-size:.76rem;color:rgba(234,240,255,.5)}

@media (max-width:420px){ .hint{display:none} }
@media (prefers-reduced-motion:reduce){
  .tilt{animation:none;transition:none}
  .card,.btn{transition:none}
}
</style>
</head>
<body>
<main>
  <div class="scene">
    <div class="tilt" id="tilt">
      <button class="card" id="card" type="button" aria-pressed="false" aria-label="Визитка. Нажмите, чтобы перевернуть">
        <span class="face front">
          <span>
            <h1 class="name" data-f="name">VapeX</h1>
            <span class="rule"></span>
            <p class="tag" data-f="tagline">Команда профессионалов: поможем выбрать устройство и жидкость под ваш вкус.</p>
          </span>
          <span class="owner">
            <span><b data-f="person">Команда VapeX</b><br><span class="role" data-f="role">Электронные сигареты</span></span>
            <span class="hint">нажмите — контакты</span>
          </span>
        </span>
        <span class="face back">
          <svg class="smoke" viewBox="0 0 200 200" aria-hidden="true">
            <path d="M20 190c40-30-30-50 10-80s-20-50 20-80" />
            <path d="M70 195c40-30-30-50 10-80s-20-50 20-80" />
            <path d="M120 200c40-30-30-50 10-80s-20-50 20-80" />
          </svg>
          <span class="back-top">
            <h2>Мы на связи</h2>
            <p class="lead">Напишите — подберём и ответим по наличию.</p>
          </span>
          <ul id="contacts"></ul>
          <span class="back-bottom">
            <span class="badge">18+</span>
            <span class="hint">нажмите — вернуться</span>
          </span>
        </span>
      </button>
    </div>
  </div>

  <p class="about" data-f="about">Продаём электронные сигареты, одноразовые устройства и жидкости. Подскажем, что подойдёт именно вам.
Подробности по ассортименту и наличию в Telegram.</p>

  <div class="actions">
    <a class="btn" id="mailBtn" href="https://t.me/Vapex_lg" target="_blank" rel="noopener">Написать в Telegram</a>
    <button class="btn ghost" id="copyBtn" type="button">Скопировать ник</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="age">Только для лиц старше 18 лет. Содержит никотин, вызывает зависимость.</p>
</main>

<script>
/* ====== РЕДАКТИРУЙТЕ ЗДЕСЬ ====== */
const DATA = {
  name:    "VapeX",
  tagline: "Команда профессионалов: поможем выбрать устройство и жидкость под ваш вкус.",
  person:  "Команда VapeX",
  role:    "Электронные сигареты",
  about:   "Продаём электронные сигареты, одноразовые устройства и жидкости. Подскажем, что подойдёт именно вам.\nПодробности по ассортименту и наличию в Telegram.",
  contacts: [
    { label: "Telegram", text: "@Vapex_lg", href: "https://t.me/Vapex_lg" }
  ]
};
/* ================================= */

document.querySelectorAll("[data-f]").forEach(el => { el.textContent = DATA[el.dataset.f]; });
document.title = DATA.name + " — визитка";

const list = document.getElementById("contacts");
const ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 3.3 2.8 10.6c-.8.3-.8 1.4 0 1.7l4.7 1.5 1.8 5.6c.2.6 1 .8 1.4.3l2.6-2.6 4.7 3.5c.6.4 1.4.1 1.6-.6L22.9 4.5c.2-.9-.6-1.5-1.4-1.2zM9.4 13.4l8.4-5.2-6.6 6.3-.3 3.3-1.5-4.4z"/></svg>';
DATA.contacts.forEach(c => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = c.href;
  a.setAttribute("aria-label", c.label + ": " + c.text);
  a.innerHTML = ICON + "<span></span>";
  a.lastChild.textContent = c.text;
  if (/^https?:/.test(c.href)) { a.target = "_blank"; a.rel = "noopener"; }
  a.addEventListener("click", e => e.stopPropagation());
  li.appendChild(a); list.appendChild(li);
});

const card = document.getElementById("card");
card.addEventListener("click", () => {
  const on = card.classList.toggle("flipped");
  card.setAttribute("aria-pressed", on);
});

/* лёгкий наклон и блик за курсором (только мышь) */
const tilt = document.getElementById("tilt");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!calm) {
  tilt.parentElement.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const r = tilt.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    tilt.style.transform = "rotateX(" + ((0.5 - y) * 8).toFixed(2) + "deg) rotateY(" + ((x - 0.5) * 10).toFixed(2) + "deg)";
    card.style.setProperty("--mx", (x * 100).toFixed(1) + "%");
    card.style.setProperty("--my", (y * 100).toFixed(1) + "%");
  });
  tilt.parentElement.addEventListener("pointerleave", () => { tilt.style.transform = ""; });
}

const tg = DATA.contacts.find(c => c.href.includes("t.me"));
if (tg) document.getElementById("mailBtn").href = tg.href;

const toast = document.getElementById("toast");
document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = DATA.contacts[0].text;
  try {
    await navigator.clipboard.writeText(text);
    toast.textContent = "Ник скопирован";
  } catch (e) {
    toast.textContent = "Не удалось скопировать — выделите текст вручную";
  }
  setTimeout(() => toast.textContent = "", 2500);
});
</script>
</body>
</html>
